[project]
name = "fantasy-football-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "espn-api>=0.46.0",
    "google-genai>=2.22.0",
    "lxml>=6.1.3",
    "markdown>=3.10.3",
    "nfl-data-py>=0.3.3",
    "openai>=3.8.0",
    "pandas>=1.5.3",
    "pulp>=3.3.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruff>=0.16.6",
    "tabulate>=0.10.0",
]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations",
    "docs"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  
]
testpaths = [
  "tests"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_football_ai"]
